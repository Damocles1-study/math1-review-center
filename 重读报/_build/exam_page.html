</head><body><div id="app"></div>

<script>
/* 精研卡里的公式：<span class="m">tex</span>，引擎每次重绘后调用 */
window.renderMathInElement=function(root){ if(!window.katex) return; root.querySelectorAll('.deep .m:not([data-k])').forEach(function(el){ try{ katex.render(el.textContent,el,{throwOnError:false,strict:false}); }catch(e){} el.setAttribute('data-k',1); }); };
window.EXAM_CONF={
  key:'cd_online',title:'真题套卷 · 重读报',heading:'读完报，上真题。目标 120 分。',
  lead:'2010–2026 每年一整套，题面和解析都是原卷、原书裁图。<b>2016 年以后没拆进报纸，留作整卷。</b>选择题自动判分，填空和解答题对照解析自评。交卷后每题下面多一张<b>精研卡</b>（考什么 · 本质 · 怎么出的 · 举一反三 · 联想搭配），卷首给出复盘限时和必吃透题。',
  backHref:'套卷.html',backText:'套卷台',
  years:[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025,2026],
  yearNote:{2010:'选填已进实战',2011:'选填已进实战',2012:'选填已进实战',2013:'选填已进实战',2014:'选填已进实战',2015:'选填已进实战'},
  minutes:180,examAt:'2026-12-20T08:30:00+08:00',examName:'数学开考',examWhen:'2026 年 12 月 20 日 8:30（业务课一）',
  target:120,essayName:'解答',dataPath:'assets/exam/y{Y}.js',ver:1,
  deepPath:'assets/exam/deep/d{Y}.js',deepVer:1,deepYears:window.EXAM_DEEP_YEARS||[],
  plan:{
    cut:'2026-12-16',pace:1.5,
    order:[[2021,'core','第一张：新题型第一年，一张「定义卷」'],[2022,'core'],[2023,'core'],
      [2020,'mid'],[2019,'mid'],[2018,'mid'],[2017,'mid'],[2016,'mid'],
      [2015,'opt','选填已在报纸实战做过'],[2014,'opt'],[2013,'opt'],[2012,'opt'],[2011,'opt'],[2010,'opt'],
      [2024,'mock','最后一周，8:30 真实时段'],[2025,'mock'],[2026,'mock']],
    tiers:{
      core:{name:'精研卷',min:150,desc:'2021–2023：10 选 6 填 6 解的新题型，报纸一题没用过。每题都有精研卡，必吃透的题逐条过「举一反三」。'},
      mid:{name:'主力卷',min:120,desc:'2016–2020：旧题型（8 选 6 填 9 解），报纸没用过。练速度和稳定，复盘只过失分题＋必吃透题。'},
      opt:{name:'补充卷',min:60,desc:'2010–2015：选择填空已拆进报纸的「实战」，整卷做会有熟悉感，主要当解答题专练。时间不够第一个砍。'},
      mock:{name:'模考卷',min:90,desc:'2024–2026：钉在最后一周，按 12/20 上午 8:30–11:30 的真实时段整卷做。只复盘失分题，不再开新坑。'}},
    rhythm:'<b>一天半一张＝三天一个循环，两科各做两张：</b><ul><li>第 1 天：上午数学卷（8:30–11:30）· 下午 408 卷（14:00–17:00）· 晚上英语、政治</li><li>第 2 天：上午两科复盘（各按卷首限时）· 下午数学第二张 · 晚上英语、政治</li><li>第 3 天：上午 408 第二张 · 下午两科复盘 · 晚上英语、政治</li></ul>做卷一口气做完、全程计时；复盘按交卷后卷首给的限时，<b>到点就停</b>，没看完的必吃透题塞进下一个循环的空档。',
    why:'<ol><li><b>2021–2023 放最前</b>：和今年同一种题型（10 选 6 填 6 解），报纸一题没用过，最值得花时间精研。先做它们，后面就算时间不够，最值钱的已经吃透。</li><li><b>2016–2020 是主力</b>：报纸同样没用过，只是题型旧一点（选择 8 道、解答 9 道），知识点和难度没变，正好练速度。</li><li><b>2010–2015 放后面</b>：它们的选择填空已经拆进报纸每期的「实战」，整卷做会撞见做过的题，价值主要在解答题；时间不够就砍。</li><li><b>2024–2026 钉在最后一周当模考</b>：最新的卷子留到最后检验状态，按真实时段做。</li><li>每张卷的复盘限时是硬的：真题的价值在于「一题吃透、同类全会」，不在于一张卷磨一周。</li></ol>'
  },
  /* 交卷后把每题得分写回套卷台的账本，失分能归回到期 */
  onScore:function(y,P,ss,tot){
    var r={};try{r=JSON.parse(localStorage.getItem('cd_exam'))||{}}catch(e){}
    var s={};P.q.forEach(function(q,i){var v=q.type==='choice'?(ss.a[q.no]===q.ans?q.score:0):ss.self[q.no];if(v!=null)s[i]=v});
    r[y]={s:s,t:(r[y]&&r[y].t)||{},tot:tot,at:Date.now()};localStorage.setItem('cd_exam',JSON.stringify(r));
  },
  footHtml:'做题记录只存在这个浏览器里，交卷后成绩同步到套卷台的账本。'
};
